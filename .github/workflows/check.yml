name: Validate site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Exact patched version, shared with Cloudflare Workers Builds via .nvmrc.
          # scripts/check-node.mjs fails the build if an unpatched Node is used anyway.
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:dev
